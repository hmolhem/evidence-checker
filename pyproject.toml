[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-checker"
version = "0.1.0"
description = "Check that every reported number in an engineering report exists in its evidence files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hossein Molhem" }]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
evidence-check = "evidence_checker.cli:main"

[tool.setuptools]
packages = ["evidence_checker"]
